<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Calculadora Premium</title>

    <meta name="theme-color" content="#111827">
    <meta name="description" content="Calculadora científica premium com interface transparente.">

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg">
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<main class="calculator">

    <header class="top">
        <div>
            <span class="small-title">CALCULADORA</span>
            <h1>Premium</h1>
        </div>

        <button id="scientificBtn" class="menu-btn">☷</button>
    </header>

    <section class="display">
        <div id="history"></div>
        <div id="display">0</div>
    </section>

    <section id="scientific" class="scientific hidden">
        <button data-value="sin(">sin</button>
        <button data-value="cos(">cos</button>
        <button data-value="tan(">tan</button>
        <button data-value="sqrt(">√</button>

        <button data-value="log(">log</button>
        <button data-value="ln(">ln</button>
        <button data-value="^">xʸ</button>
        <button data-value="pi">π</button>
    </section>

    <section class="memory">
        <button data-action="mc">MC</button>
        <button data-action="mr">MR</button>
        <button data-action="mplus">M+</button>
        <button data-action="mminus">M−</button>
    </section>

    <section class="buttons">

        <button class="function" data-action="clear">AC</button>
        <button class="function" data-action="delete">⌫</button>
        <button class="function" data-value="%">%</button>
        <button class="operator" data-value="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>

        <button class="zero" data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="equals" data-action="calculate">=</button>

    </section>

    <footer>
        <span>Calculadora Premium</span>
    </footer>

</main>

<script src="script.js"></script>

</body>
</html>
